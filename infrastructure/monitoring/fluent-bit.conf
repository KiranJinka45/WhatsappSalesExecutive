[SERVICE]
    Flush        1
    Grace        30
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

[FILTER]
    Name         parser
    Match        *
    Key_Name     log
    Parser       json
    Reserve_Data On

[FILTER]
    Name         record_modifier
    Match        *
    Record       cluster_name closely-ai-cluster

[OUTPUT]
    Name        grafana-loki
    Match       *
    Host        loki.closely.internal
    Port        3100
    Line_Format json
    Labels      {job="closely-ai-logs", container="$container_name", tenant_id="$tenant_id", level="$level"}
    Remove_Keys container_id,ecs_task_arn
    Auto_Kubernetes_Labels off
