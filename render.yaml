# Render Infrastructure-as-Code Blueprint
# https://render.com/docs/blueprint-spec

services:
  # --- FastAPI Web Service (handles webhooks + API) ---
  - type: web
    name: closely-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: ./backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: closely-redis
          property: connectionString
    envVarGroups:
      - name: closely-secrets

  # --- Background Worker (processes AI responses from Redis queue) ---
  - type: worker
    name: closely-worker
    runtime: python
    region: oregon
    plan: free
    rootDir: ./backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker
    envVars:
      - key: APP_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: closely-redis
          property: connectionString
    envVarGroups:
      - name: closely-secrets

  # --- Redis Instance (message queue) ---
  - type: redis
    name: closely-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

