version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: closely_db
    restart: always
    environment:
      POSTGRES_DB: closely_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: closely_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-closely_redis_secure_2026} --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build: ./backend
    container_name: closely_backend
    restart: always
    ports:
      - "8005:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/closely_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-closely_redis_secure_2026}@redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build: ./backend
    container_name: closely_worker
    restart: always
    command: ["python", "-m", "app.worker"]
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/closely_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-closely_redis_secure_2026}@redis:6379/0
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    container_name: closely_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
